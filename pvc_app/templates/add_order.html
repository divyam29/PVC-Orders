{% extends "base.html" %}
{% block content %}
<div class="utility-bar"><div class="title">Add New Order</div></div>
<div class="card p-4">
  <form method="POST" id="orderForm">
    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <label class="form-label">Client Name</label>
        <input type="text" name="client_name" class="form-control" required>
      </div>
      <div class="col-md-6 d-flex align-items-end justify-content-end">
        <button type="button" class="btn btn-secondary" id="addOrderTypeBtn">Add Order Type</button>
      </div>
    </div>
    <input type="hidden" name="line_count" id="lineCount" value="0">
    <div id="orderTypeRows"></div>
    <button type="submit" class="btn btn-primary mt-3">Add Order</button>
  </form>
</div>

<template id="orderTypeTemplate">
  <div class="border rounded p-3 mb-4 order-type-row">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <strong>Order Type <span class="order-index"></span></strong>
      <button type="button" class="btn btn-sm btn-outline-danger remove-order-type">Remove</button>
    </div>
    <div class="row g-3 mb-3">
      <div class="col-md-3">
        <label class="form-label">Pipe Type</label>
        <select class="form-select pipe-type" name="pipe_type_0" required>
          <option value="garden">Garden</option>
          <option value="braided">Braided</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Color</label>
        <input type="text" class="form-control color-field" name="color_0" required>
      </div>
      <div class="col-md-3 garden-only">
        <label class="form-label">Machine</label>
        <select class="form-select machine-type" name="machine_type_0">
          <option value="fresh_garden">Fresh Garden</option>
          <option value="recycled_garden">Recycled Garden</option>
        </select>
      </div>
      <div class="col-md-3 garden-only">
        <label class="form-label">Coating Type</label>
        <select class="form-select coating-type" name="coating_type_0">
          <option value="Without Coating">Without Coating</option>
          <option value="Single Coating">Single Coating</option>
          <option value="Double Coating">Double Coating</option>
        </select>
      </div>
      <div class="col-md-3 garden-only">
        <label class="form-label">Design</label>
        <input type="text" class="form-control design-field" name="design_0" list="designOptions_0">
        <datalist id="designOptions_0"></datalist>
      </div>
    </div>
    <input type="hidden" name="sub_count_0" value="1" class="sub-count">
    <div class="subrows"></div>
    <button type="button" class="btn btn-sm btn-secondary add-subrow-btn mt-2">Add Size Row</button>
  </div>
</template>

<template id="subrowTemplate">
  <div class="row g-2 align-items-end subrow mb-2">
    <div class="col-6 col-md-2">
      <label class="form-label">Size</label>
      <select class="form-select size-field" name="size_inches_0_0" required>
        {% for s in sizes %}
          <option value="{{ s }}">{{ s }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-6 col-md-3">
      <label class="form-label">Quantity (no of pcs)</label>
      <input type="number" step="1" class="form-control qty-field" name="quantity_pcs_0_0" required>
    </div>
    <div class="col-6 col-md-3">
      <label class="form-label">Weight per bundle (kgs)</label>
      <input type="number" step="0.01" class="form-control weight-field" name="bundle_weight_0_0">
    </div>
    <div class="col-10 col-md-3">
      <label class="form-label">Length per bundle (meters)</label>
      <input type="text" class="form-control length-field" name="length_0_0" value="30" placeholder="e.g. 30">
    </div>
    <div class="col-2 col-md-1 d-flex justify-content-end align-items-end">
      <button type="button" class="btn btn-sm btn-outline-danger remove-subrow-btn" aria-label="Remove size row">×</button>
    </div>
  </div>
</template>

<script>
  window.COATING_DESIGNS = {{ coating_designs|tojson }};
  const orderTypeRows = document.getElementById("orderTypeRows");
  const orderTypeTemplate = document.getElementById("orderTypeTemplate");
  const subrowTemplate = document.getElementById("subrowTemplate");
  const addOrderTypeBtn = document.getElementById("addOrderTypeBtn");
  const lineCount = document.getElementById("lineCount");

  function refreshDesigns(row) {
    const coating = row.querySelector(".coating-type");
    const list = row.querySelector("datalist");
    const design = row.querySelector(".design-field");
    const options = window.COATING_DESIGNS[coating.value || "Without Coating"] || [];
    list.innerHTML = options.map(v => `<option value="${v}"></option>`).join("");
    design.setCustomValidity("");
  }

  function toggleGarden(row) {
    const garden = row.querySelector(".pipe-type").value === "garden";
    row.querySelectorAll(".garden-only").forEach(el => el.style.display = garden ? "" : "none");
  }

  function reindex() {
    const orderRows = [...orderTypeRows.querySelectorAll(".order-type-row")];
    lineCount.value = orderRows.length;
    orderRows.forEach((row, i) => {
      row.querySelector(".order-index").textContent = i + 1;
      row.querySelector(".pipe-type").name = `pipe_type_${i}`;
      row.querySelector(".color-field").name = `color_${i}`;
      row.querySelector(".machine-type").name = `machine_type_${i}`;
      row.querySelector(".coating-type").name = `coating_type_${i}`;
      row.querySelector(".design-field").name = `design_${i}`;
      row.querySelector(".design-field").setAttribute("list", `designOptions_${i}`);
      row.querySelector("datalist").id = `designOptions_${i}`;
      row.querySelector(".sub-count").name = `sub_count_${i}`;
      const subs = [...row.querySelectorAll(".subrow")];
      row.querySelector(".sub-count").value = subs.length;
      subs.forEach((sub, j) => {
        sub.querySelector(".size-field").name = `size_inches_${i}_${j}`;
        sub.querySelector(".qty-field").name = `quantity_pcs_${i}_${j}`;
        sub.querySelector(".weight-field").name = `bundle_weight_${i}_${j}`;
        sub.querySelector(".length-field").name = `length_${i}_${j}`;
        const removeSubrowBtn = sub.querySelector(".remove-subrow-btn");
        if (removeSubrowBtn) {
          removeSubrowBtn.onclick = () => {
            if (subs.length > 1) {
              sub.remove();
              reindex();
            }
          };
        }
      });
      toggleGarden(row);
      refreshDesigns(row);
    });
  }

  function addSubrow(row, prefill) {
    const frag = subrowTemplate.content.cloneNode(true);
    const sub = frag.querySelector(".subrow");
    if (prefill) {
      sub.querySelector(".size-field").value = prefill.size_inches || "";
      sub.querySelector(".qty-field").value = prefill.quantity_pcs || "";
      sub.querySelector(".weight-field").value = prefill.weight_per_piece_kg || "";
      sub.querySelector(".length-field").value = prefill.length || "30";
    } else {
      sub.querySelector(".length-field").value = "30";
    }
    row.querySelector(".subrows").appendChild(frag);
    reindex();
  }

  function addOrderType(prefill) {
    const frag = orderTypeTemplate.content.cloneNode(true);
    const row = frag.querySelector(".order-type-row");
    if (prefill) {
      row.querySelector(".pipe-type").value = prefill.pipe_type || "garden";
      row.querySelector(".color-field").value = prefill.color || "";
      row.querySelector(".machine-type").value = prefill.machine_type || "fresh_garden";
      row.querySelector(".coating-type").value = prefill.coating_type || "Without Coating";
      row.querySelector(".design-field").value = prefill.design || "";
      const subrows = row.querySelector(".subrows");
      subrows.innerHTML = "";
      (prefill.subrows || []).forEach(sr => addSubrow(row, sr));
    }
    row.querySelector(".remove-order-type").addEventListener("click", () => { row.remove(); reindex(); });
    row.querySelector(".add-subrow-btn").addEventListener("click", () => addSubrow(row));
    row.querySelector(".pipe-type").addEventListener("change", () => { toggleGarden(row); reindex(); });
    row.querySelector(".coating-type").addEventListener("change", () => refreshDesigns(row));
    orderTypeRows.appendChild(frag);
    if (!prefill) {
      addSubrow(row);
      return;
    }
    reindex();
  }

  addOrderTypeBtn.addEventListener("click", () => addOrderType());
  addOrderType();
</script>
{% endblock %}
